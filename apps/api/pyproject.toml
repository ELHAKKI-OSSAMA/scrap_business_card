[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-suite-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "ocr-suite-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "SQLAlchemy>=2.0.32",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "celery>=5.4",
  "PyJWT>=2.9",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "boto3>=1.34",
  "prometheus-client>=0.20",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "ocr: tests that run the real PaddleOCR models (slow, needs model weights)",
  "tesseract: tests that need the tesseract binary with ara/fra/eng",
  "postgres: tests that need a PostgreSQL database (TEST_DATABASE_URL)",
]
filterwarnings = ["ignore::DeprecationWarning"]
