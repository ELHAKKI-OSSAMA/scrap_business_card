# Production TLS variant of gateway.conf (mounted by docker-compose.prod.yml).
# Certificates: mount fullchain.pem / privkey.pem into /etc/nginx/certs (e.g. from certbot).

limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

upstream api_upstream { server api:8000; keepalive 16; }
upstream card_upstream { server business-card-web:8081; }

server {
    listen 80;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_tokens off;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    client_max_body_size 16m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = / { return 302 /cards/; }
    location /cards/ { proxy_pass http://card_upstream; }
    location = /api/v1/metrics { return 404; }
    location /api/v1/auth/ { limit_req zone=auth burst=10 nodelay; proxy_pass http://api_upstream; include /etc/nginx/proxy_common.conf; }
    location /api/ { limit_req zone=api burst=60 nodelay; proxy_pass http://api_upstream; include /etc/nginx/proxy_common.conf; proxy_read_timeout 120s; }
}
