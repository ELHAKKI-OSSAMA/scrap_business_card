# Reverse proxy / single origin for the business-card web app and the API.
#   /cards/      -> business-card-web
#   /api/        -> api (FastAPI)
# TLS: see infrastructure/nginx/gateway.tls.conf and docs/deployment/production.md

limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

upstream api_upstream { server api:8000; keepalive 16; }
upstream card_upstream { server business-card-web:8081; }

server {
    listen 80;
    server_tokens off;
    client_max_body_size 16m;   # API enforces MAX_UPLOAD_MB (default 15) as well

    # security headers for the SPAs (the API sets its own no-store headers)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = / { return 302 /cards/; }

    location /cards/ { proxy_pass http://card_upstream; }

    # metrics are for the internal network (Prometheus scrapes api:8000 directly)
    location = /api/v1/metrics { return 404; }

    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api_upstream;
        include /etc/nginx/proxy_common.conf;
    }
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api_upstream;
        include /etc/nginx/proxy_common.conf;
        proxy_read_timeout 120s;
        proxy_request_buffering on;
    }
}
