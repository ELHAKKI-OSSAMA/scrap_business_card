# Mimics vercel.json routing for local tests: /api/* -> the Python function, everything else -> SPA.
server {
    listen 8090;
    client_max_body_size 4500k;   # Vercel function request-body limit (4.5 MB)

    location /api/ {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;     # vercel.json maxDuration
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
