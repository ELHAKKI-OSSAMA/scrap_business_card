# Local simulation of the production cloud deployment (Vercel + Supabase + Ollama Cloud):
#   app      = api/index.py with requirements.txt only            (Vercel Python function)
#   web      = SPA built with VITE_BASE=/ + vercel.json routing  (Vercel static + rewrites)
#   postgres = PostgreSQL                                         (Supabase Postgres)
#   s3       = SeaweedFS S3 API, path-style, no SSE               (Supabase Storage S3)
# OCR + extraction: Gemma 4 on Ollama Cloud (OLLAMA_KEYS from .env).
#
#   npm run build -w apps/business-card-web  (with VITE_BASE=/)
#   docker compose -f docker-compose.vercel-sim.yml up -d --build
#   -> http://localhost:8090
name: ocr-vercel-sim

x-app-env: &app-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+psycopg://ocr:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/ocr
  DB_SERVERLESS: "true"
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://s3:8333
  S3_BUCKET: business-cards
  S3_ACCESS_KEY: sim-access-key   # the local S3 runs without identities (accepts any key)
  S3_SECRET_KEY: sim-secret-key
  S3_SSE: ""
  S3_FORCE_PATH_STYLE: "true"
  OCR_PROVIDER: ollama
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:31b}
  OLLAMA_KEYS: ${OLLAMA_KEYS:?set OLLAMA_KEYS in .env}
  ALLOW_REGISTRATION: "true"
  CRON_SECRET: ${CRON_SECRET:-sim-cron-secret}
  LOG_LEVEL: INFO

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ocr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ocr
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocr -d ocr"]
      interval: 5s
      retries: 20

  s3:  # MinIO images are no longer published on Docker Hub; SeaweedFS speaks the same S3 API
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 5s
      retries: 30

  migrate:
    build: { context: ., dockerfile: infrastructure/docker/vercel-sim.Dockerfile }
    image: ocr-suite/vercel-sim:latest
    working_dir: /var/task/apps/api
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }

  app:
    image: ocr-suite/vercel-sim:latest
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3: { condition: service_healthy }

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./infrastructure/nginx/vercel-sim.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/business-card-web/dist:/usr/share/nginx/html:ro
    ports: ["127.0.0.1:8090:8090"]
    depends_on: [app]
