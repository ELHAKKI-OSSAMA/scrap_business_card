# Multilingual OCR Suite – default CPU stack.
#
#   cp .env.example .env        # then set the secrets
#   docker compose up --build   # http://localhost:8080/cards/
#
# Optional profiles / overrides (see docs/deployment/docker.md):
#   --profile minio        S3-compatible object storage (set STORAGE_BACKEND=s3)
#   --profile monitoring   Prometheus + Grafana
#   --profile clamav       ClamAV malware scanning (set MALWARE_SCANNER=clamav)
#   -f docker-compose.gpu.yml   NVIDIA GPU worker
#   -f docker-compose.dev.yml   development (hot reload, exposed ports)
#   -f docker-compose.prod.yml  production (TLS, restart policies, no exposed internals)

name: ocr-suite

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ocr}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ocr}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  JOB_EXECUTION: celery
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  STORAGE_LOCAL_PATH: /data/storage
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_BUCKET: ${S3_BUCKET:-ocr-suite}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
  MALWARE_SCANNER: ${MALWARE_SCANNER:-none}
  OCR_PROVIDER: ${OCR_PROVIDER:-paddleocr}
  OCR_FALLBACK_PROVIDER: ${OCR_FALLBACK_PROVIDER:-tesseract}
  OCR_DEVICE: cpu
  OCR_DET_MODEL: ${OCR_DET_MODEL:-PP-OCRv5_mobile_det}
  DEFAULT_PHONE_REGION: ${DEFAULT_PHONE_REGION:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-none}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-none}
  TRANSLATION_URL: ${TRANSLATION_URL:-}
  DELETED_RETENTION_DAYS: ${DELETED_RETENTION_DAYS:-30}
  DOCUMENT_RETENTION_DAYS: ${DOCUMENT_RETENTION_DAYS:-0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ocr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ocr}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    restart: unless-stopped

  migrate:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    image: ocr-suite/api:${IMAGE_TAG:-latest}
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    restart: "no"

  api:
    image: ocr-suite/api:${IMAGE_TAG:-latest}
    environment: *api-env
    volumes: [storage:/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend, frontend]
    restart: unless-stopped

  worker:
    image: ocr-suite/api:${IMAGE_TAG:-latest}
    command: ["celery", "-A", "app.worker", "worker", "-Q", "ocr", "--concurrency", "1", "--loglevel", "INFO"]
    environment:
      <<: *api-env
      OCR_WARMUP: "true"
    volumes: [storage:/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    networks: [backend]
    restart: unless-stopped

  beat:
    image: ocr-suite/api:${IMAGE_TAG:-latest}
    command: ["celery", "-A", "app.worker", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true   # beat has no HTTP server; the image healthcheck targets the API
    environment: *api-env
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [backend]
    restart: unless-stopped

  business-card-web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args: { APP: business-card-web, BASE_PATH: /cards/ }
    image: ocr-suite/business-card-web:${IMAGE_TAG:-latest}
    networks: [frontend]
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes:
      - ./infrastructure/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/proxy_common.conf:/etc/nginx/proxy_common.conf:ro
    depends_on:
      api: { condition: service_healthy }
      business-card-web: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [frontend]
    restart: unless-stopped

  # ------------------------------------------------------------------ optional
  minio:
    profiles: [minio]
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-}
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  clamav:
    profiles: [clamav]
    image: clamav/clamav:stable
    networks: [backend]
    restart: unless-stopped

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:latest
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [backend, frontend]
    restart: unless-stopped

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    networks: [backend]
    restart: unless-stopped

networks:
  backend: { internal: true }   # postgres / redis / workers are never reachable from outside
  frontend: {}

volumes:
  pgdata: {}
  redisdata: {}
  storage: {}
  miniodata: {}
  promdata: {}
  grafanadata: {}
