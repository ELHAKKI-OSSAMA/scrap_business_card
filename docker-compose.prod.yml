# Production override: TLS gateway, strict settings, resource limits.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Secrets must come from the environment / a secret manager (never committed).
services:
  api:
    environment:
      ENVIRONMENT: production
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
    restart: always
    deploy:
      resources: { limits: { cpus: "2", memory: 2g } }
  worker:
    environment:
      ENVIRONMENT: production
    restart: always
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
      resources: { limits: { cpus: "4", memory: 4g } }
  beat:
    environment: { ENVIRONMENT: production }
    restart: always
  migrate:
    environment: { ENVIRONMENT: production }
  gateway:
    ports: ["80:80", "443:443"]
    volumes:
      - ./infrastructure/nginx/gateway.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/proxy_common.conf:/etc/nginx/proxy_common.conf:ro
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
    restart: always
  postgres:
    restart: always
  redis:
    restart: always

volumes:
  certbot-www: {}
